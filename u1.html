<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Amezona</title>
    <link rel="stylesheet" href="styles.css">
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f3f3f3;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.logo-si a{
    align-items: center;
    margin-left: 110px;
    
}
.container label{
    font-family: 'Gill Sans', 'Gill Sans MT', 'Calibri', 'Trebuchet MS', sans-serif;
}
.container {
    background: white;
    padding: 20px;
    border-radius: 8px;
    width: 300px;
    text-align: center;
    margin-bottom: 60px;
}
.container:hover{
     box-shadow: 10px  10px 10px rgba(0,0,0,0.4);
}
.container small{
    margin-top: 10px;
}
.container input:hover{
    box-shadow: 10px 10px 10px rgb(0,0,0,0.4);
    
}
.container a{
        margin-right: 110px;
}
h1 {
    color: #333;
    margin-bottom: 20px;
}

form {
    display: flex;
    flex-direction: column;
}

label {
    margin-top: 10px;
    text-align: left;
}

input {
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    margin-top: 20px;
    padding: 10px;
    background-color: #ff9900;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background-color: #e68a00;
}

small {
    color: #666;
    font-size: 0.8em;
}

a {
    color: #007185;
    text-decoration: none;
}
</style>
</head>
<body>
    <div class="logo-si">
        <a>
            <img src="amazon-logo-.png" height="100px" width="120px">
        </a>
    
    <div class="container">
        <h1>Sign in or create account
</h1>
        <form id="signup-form">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required>
            <small>Passwords must be at least 8 characters.</small>

            <button type="submit">Create Account</button>
        </form>
        <p>Already have an account?</p><a href="#">Sign In</a>
    </div></div>
    <script src="script.js">

document.getElementById('signup-form').addEventListener('submit', function(event) {
    event.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (password.length < 8) {
        alert('Password must be at least 8 characters.');
        return;
    }

    // Simulate account creation (replace with real backend logic)
    alert(`Account created for ${name} with email ${email}!`);
    // Here you could send data to a server via fetch() or AJAX
});
</script>
</body>
</html>
